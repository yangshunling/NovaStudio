<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova Studio</title>
  <script>
    /*
     * 首帧前的主题引导：模块脚本是 deferred，执行前窗口已经可能绘制一帧。
     * 这里先按 localStorage 缓存贴上 data-theme 与底色，避免深色皮肤启动白闪。
     */
    (function () {
      try {
        var raw = localStorage.getItem("nova-skin");
        var parsed = raw ? JSON.parse(raw) : null;
        var hasCache = parsed && typeof parsed.theme === "string";

        /*
         * 默认值由 electron.vite.config 从 shared/skin-default.ts 注入，
         * 与皮肤注册表、主进程窗口背景共用同一份常量。
         */
        var theme = hasCache ? parsed.theme : "%NOVA_DEFAULT_SKIN%";

        /*
         * 已移除的旧皮肤：把缓存里的 id 映射到现有皮肤，
         * 否则首帧会带上一个没有任何 token 的 data-theme，闪一下未样式化内容。
         */
        var legacyNight = theme === "classic-night";
        if (legacyNight) theme = "nova-nocturne";
        if (theme === "classic-day") theme = "nova-paper";

        var appearance =
          parsed && typeof parsed.appearance === "string"
            ? parsed.appearance
            : hasCache
              ? legacyNight ||
                theme.indexOf("night") >= 0 ||
                theme.indexOf("nocturne") >= 0
                ? "dark"
                : "light"
              : "%NOVA_DEFAULT_APPEARANCE%";
        var dark = appearance === "dark";

        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        document.documentElement.style.backgroundColor = dark
          ? "%NOVA_DEFAULT_WINDOW_BACKGROUND%"
          : "%LIGHT_WINDOW_BACKGROUND%";
      } catch (_) {
        // 缓存损坏时保持内置默认值，由应用启动后修正
      }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./main.tsx"></script>
</body>
</html>

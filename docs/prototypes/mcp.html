<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MCP 资产 · 原型</title>
<style>
  /* ============================================================
     token：与 Nova 皮肤对齐
     ============================================================ */
  :root {
    --rail: 224px;
    --list: 304px;
    --bg: #f6f7f9;
    --panel: #ffffff;
    --col: #f3f5f7;
    --card: #ffffff;
    --border: #e4e7ec;
    --border-strong: #d0d5dd;
    --text: #101828;
    --text-2: #475467;
    --muted: #98a2b3;
    --accent: #0969da;
    --accent-soft: rgba(9, 105, 218, 0.08);
    --violet: #7a55f0;
    --violet-soft: rgba(122, 85, 240, 0.1);
    --teal: #0f8a78;
    --teal-soft: rgba(15, 138, 120, 0.1);
    --success: #1a7f37;
    --success-soft: rgba(26, 127, 55, 0.1);
    --error: #cf222e;
    --error-soft: rgba(207, 34, 46, 0.08);
    --warn: #b26a10;
    --warn-soft: rgba(178, 106, 16, 0.1);
    --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.05);
    --shadow-md: 0 8px 24px rgba(16, 24, 40, 0.1);
  }

  [data-theme="dark"] {
    --bg: #0a0b0d;
    --panel: #101215;
    --col: #15181c;
    --card: #1b1f25;
    --border: #262b32;
    --border-strong: #363d47;
    --text: #f2f4f7;
    --text-2: #a7b0bd;
    --muted: #6b7480;
    --accent: #3b8ef7;
    --accent-soft: rgba(59, 142, 247, 0.14);
    --violet: #a08cff;
    --violet-soft: rgba(160, 140, 255, 0.14);
    --teal: #4ecdb6;
    --teal-soft: rgba(78, 205, 182, 0.12);
    --success: #3fb950;
    --success-soft: rgba(63, 185, 80, 0.12);
    --error: #f85149;
    --error-soft: rgba(248, 81, 73, 0.12);
    --warn: #d29922;
    --warn-soft: rgba(210, 153, 34, 0.12);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
    --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.5);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", "Inter", sans-serif;
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
  }
  button, input, textarea { font: inherit; color: inherit; }
  svg { display: block; }

  .app { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); height: 100%; }

  /* ---------- 侧栏（与看板原型一致） ---------- */
  .rail {
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 14px 12px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .brand { display: flex; align-items: center; gap: 9px; padding: 2px 6px 10px; font-weight: 650; }
  .brand-mark {
    width: 24px; height: 24px; border-radius: 7px;
    background: linear-gradient(135deg, var(--accent), #6aa9ff);
    box-shadow: 0 4px 12px var(--accent-soft);
  }
  .nav-group { display: flex; flex-direction: column; gap: 2px; }
  .nav-label { padding: 4px 8px 6px; font-size: 11px; color: var(--muted); font-weight: 600; }
  .nav-item {
    display: flex; align-items: center; gap: 9px;
    padding: 7px 9px; border-radius: 8px; color: var(--text-2); user-select: none;
  }
  .nav-item svg { width: 15px; height: 15px; opacity: 0.85; }
  .nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

  /* ---------- 顶栏 ---------- */
  .main { display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    height: 56px; flex: none;
    display: flex; align-items: center; gap: 12px;
    padding: 0 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .topbar h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -0.01em; }
  .count-chip {
    font-size: 11px; color: var(--text-2); background: var(--col);
    border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px;
    font-variant-numeric: tabular-nums;
  }
  .topbar-spacer { flex: 1; }

  .icon-btn {
    width: 32px; height: 32px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--panel);
    color: var(--text-2); display: grid; place-items: center; cursor: pointer;
    transition: background 120ms ease, color 120ms ease, border-color 120ms ease;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--border-strong); }

  .search {
    display: flex; align-items: center; gap: 7px;
    height: 32px; width: 200px; padding: 0 11px;
    border-radius: 999px; border: 1px solid var(--border);
    background: var(--panel); color: var(--muted);
  }
  .search input { border: 0; outline: 0; background: transparent; color: var(--text); width: 100%; font-size: 12px; }
  .search input::placeholder { color: var(--muted); }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 32px; padding: 0 13px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--panel);
    color: var(--text-2); font-size: 12px; cursor: pointer;
    transition: color 120ms ease, border-color 120ms ease, background 120ms ease;
  }
  .btn:hover { color: var(--text); border-color: var(--border-strong); }
  .btn.primary {
    background: var(--accent); border-color: transparent; color: #fff; font-weight: 550;
    box-shadow: var(--shadow-sm);
  }
  .btn.primary:hover { filter: brightness(1.06); transform: translateY(-1px); }
  .btn.danger { color: var(--error); }
  .btn.danger:hover { background: var(--error-soft); border-color: transparent; }

  /* ---------- 主体：列表 + 详情 ---------- */
  .body {
    flex: 1; min-height: 0;
    display: grid;
    grid-template-columns: var(--list) minmax(0, 1fr);
  }

  /* 左：列表 */
  .list-pane {
    display: flex; flex-direction: column; min-height: 0;
    background: var(--panel);
    border-right: 1px solid var(--border);
  }

  .filters {
    flex: none;
    display: flex; align-items: center; gap: 6px;
    padding: 12px 12px 8px;
    overflow-x: auto;
  }
  .chip {
    flex: none;
    height: 24px; padding: 0 9px; border-radius: 999px;
    border: 1px solid var(--border); background: transparent;
    color: var(--text-2); font-size: 11.5px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 5px;
    transition: background 120ms ease, color 120ms ease, border-color 120ms ease;
  }
  .chip:hover { border-color: var(--border-strong); color: var(--text); }
  .chip.on { background: var(--accent-soft); border-color: transparent; color: var(--accent); font-weight: 600; }
  .chip .n { opacity: 0.7; font-variant-numeric: tabular-nums; }

  .server-list {
    flex: 1; min-height: 0; overflow-y: auto;
    padding: 2px 8px 12px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .server-list::-webkit-scrollbar { width: 8px; }
  .server-list::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 999px; }

  .server-row {
    position: relative;
    display: flex; align-items: center; gap: 10px;
    width: 100%;
    padding: 9px 10px;
    border: 0; background: transparent; text-align: left;
    border-radius: 9px; cursor: pointer;
    transition: background 120ms ease;
  }
  .server-row:hover { background: var(--col); }
  .server-row.on { background: var(--accent-soft); }
  .server-row.on::before {
    content: ""; position: absolute; left: 0; top: 50%;
    width: 2px; height: 18px; transform: translateY(-50%);
    border-radius: 999px; background: var(--accent);
  }
  .server-row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  .row-tile {
    width: 30px; height: 30px; flex: none;
    border-radius: 8px; display: grid; place-items: center;
    background: var(--col); color: var(--muted);
  }
  .server-row.on .row-tile { background: rgba(255, 255, 255, 0.7); }
  [data-theme="dark"] .server-row.on .row-tile { background: rgba(255, 255, 255, 0.06); }
  .row-tile svg { width: 15px; height: 15px; }
  .row-tile.stdio { background: var(--accent-soft); color: var(--accent); }
  .row-tile.http { background: var(--violet-soft); color: var(--violet); }
  .row-tile.sse { background: var(--teal-soft); color: var(--teal); }

  .row-main { min-width: 0; flex: 1; }
  /* span 默认是行内元素，省略号只在块级容器上生效 */
  .row-name {
    display: block;
    font-size: 12.5px; font-weight: 550; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row-sub {
    display: block;
    margin-top: 1px;
    font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
    font-size: 10.5px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row-dot { width: 6px; height: 6px; border-radius: 999px; flex: none; background: var(--success); }
  .row-dot.warn { background: var(--warn); }
  .row-dot.error { background: var(--error); }

  /* 右：详情 */
  .detail {
    min-width: 0; min-height: 0; overflow-y: auto;
    padding: 20px 24px 28px;
  }
  .detail-inner { max-width: 800px; margin: 0 auto; }

  .detail-head { display: flex; align-items: flex-start; gap: 14px; }
  .detail-tile {
    width: 46px; height: 46px; flex: none; border-radius: 12px;
    display: grid; place-items: center;
    background: var(--accent-soft); color: var(--accent);
  }
  .detail-tile svg { width: 22px; height: 22px; }
  .detail-title { min-width: 0; flex: 1; }
  .detail-title h2 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -0.01em; }
  .detail-title .slug {
    margin-top: 3px;
    font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
    font-size: 11.5px; color: var(--muted);
  }
  .detail-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

  .pill {
    display: inline-flex; align-items: center; gap: 4px;
    height: 20px; padding: 0 8px; border-radius: 999px;
    font-size: 11px; font-weight: 550; color: var(--text-2);
    background: var(--col); white-space: nowrap;
  }
  .pill svg { width: 11px; height: 11px; }
  .pill.accent { color: var(--accent); background: var(--accent-soft); }
  .pill.violet { color: var(--violet); background: var(--violet-soft); }
  .pill.success { color: var(--success); background: var(--success-soft); }
  .pill.error { color: var(--error); background: var(--error-soft); }
  .pill.warn { color: var(--warn); background: var(--warn-soft); }

  .detail-head-actions { display: flex; gap: 8px; flex: none; }

  .section { margin-top: 22px; }
  .section-head {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 8px;
  }
  .section-head h3 {
    margin: 0; font-size: 12px; font-weight: 600; color: var(--text-2);
    letter-spacing: 0.01em;
  }
  .section-head .spacer { flex: 1; }
  .section-hint { font-size: 11.5px; color: var(--muted); }

  .code-block {
    position: relative;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--col);
    padding: 11px 12px;
    font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
    font-size: 12px;
    line-height: 1.65;
    color: var(--text);
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .code-block .prompt { color: var(--muted); user-select: none; }
  .copy-btn {
    position: absolute; top: 7px; right: 7px;
    height: 24px; padding: 0 8px; border-radius: 7px;
    border: 1px solid var(--border); background: var(--panel);
    color: var(--text-2); font-size: 11px; cursor: pointer;
  }
  .copy-btn:hover { color: var(--text); border-color: var(--border-strong); }

  .kv {
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    background: var(--card);
  }
  .kv-row {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px;
    border-bottom: 1px solid var(--border);
  }
  .kv-row:last-child { border-bottom: 0; }
  .kv-key {
    min-width: 140px;
    font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
    font-size: 11.5px; color: var(--text-2);
  }
  .kv-val {
    flex: 1; min-width: 0;
    font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
    font-size: 11.5px; color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .kv-val.secret { color: var(--muted); letter-spacing: 0.1em; }
  .kv-tag {
    flex: none; font-size: 10.5px; color: var(--warn);
    background: var(--warn-soft); border-radius: 999px; padding: 1px 7px;
  }

  .people { display: flex; flex-wrap: wrap; gap: 8px; }
  .person {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 4px 10px 4px 4px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--card);
    font-size: 11.5px;
    color: var(--text-2);
  }
  .person .av {
    width: 20px; height: 20px; border-radius: 999px;
    display: grid; place-items: center;
    font-size: 10px; font-weight: 600; color: #fff;
  }

  .issue {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 10px 12px;
    border-radius: 10px;
    background: var(--error-soft);
    color: var(--error);
    font-size: 12px; line-height: 1.55;
  }
  .issue svg { width: 14px; height: 14px; flex: none; margin-top: 1px; }

  .editor {
    width: 100%;
    min-height: 240px;
    resize: vertical;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--col);
    color: var(--text);
    padding: 12px;
    font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
    font-size: 11.5px;
    line-height: 1.7;
    outline: none;
  }
  .editor:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  .edit-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }

  .detail-foot {
    margin-top: 28px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  .detail-foot .spacer { flex: 1; }

  .empty {
    height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; color: var(--muted); text-align: center; padding: 24px;
  }
  .empty svg { width: 22px; height: 22px; opacity: 0.6; }
  .empty strong { color: var(--text-2); font-weight: 600; font-size: 13px; }

  .hidden { display: none !important; }
</style>
</head>

      command: "",
      url: "https://api.githubcopilot.com/mcp/",
      description: "GitHub 官方 HTTP 端点：仓库、Issue 与 PR。",
      updated: "11-06 20:41",
      valid: true,
      problems: [],
      env: {},
      headers: { Authorization: "Bearer ghp_example_token_value" },
      definition: {
        type: "http",
        url: "https://api.githubcopilot.com/mcp/",
        headers: { Authorization: "Bearer ghp_example_token_value" },
      },
      employees: [],
    },
    {
      id: "local-db",
      name: "local-db",
      slug: "local-db",
      transport: "http",
      command: "",
      url: "",
      description: "本地数据库查询服务。",
      updated: "11-05 09:12",
      valid: false,
      problems: ["http 传输必须提供 url 字段"],
      env: {},
      headers: {},
      definition: { type: "http" },
      employees: [],
    },
  ];

  const TRANSPORT_LABEL = { stdio: "stdio", http: "HTTP", sse: "SSE" };

  /* ============================================================
     状态
     ============================================================ */
  const params = new URLSearchParams(location.search);
  let filter = "all";
  let query = "";
  let selectedId = params.get("sel") || "filesystem";
  let editing = params.get("edit") === "1";
  let revealed = new Set();

  if (params.get("theme") === "dark") {
    document.documentElement.dataset.theme = "dark";
  }

  document.getElementById("themeToggle").addEventListener("click", () => {
    const root = document.documentElement;
    root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
  });

  /* ============================================================
     工具
     ============================================================ */
  const esc = (value) =>
    String(value).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  const endpointOf = (server) =>
    server.transport === "stdio" ? server.command : server.url || "未配置地址";

  const visibleServers = () => {
    const keyword = query.trim().toLowerCase();
    return SERVERS.filter((server) => {
      if (filter === "issue" && server.valid) return false;
      if ((filter === "stdio" || filter === "http") && server.transport !== filter) return false;
      if (!keyword) return true;
      return [server.name, server.slug, server.description, endpointOf(server)]
        .join(" ")
        .toLowerCase()
        .includes(keyword);
    });
  };

  /* ============================================================
     列表
     ============================================================ */
  const LIST_ICON = `
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <rect x="3" y="4" width="18" height="7" rx="2"/>
      <rect x="3" y="14" width="18" height="6" rx="2"/>
    </svg>`;

  function renderList() {
    const list = document.getElementById("serverList");
    const items = visibleServers();

    if (items.length === 0) {
      list.innerHTML = `
        <div class="empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <strong>没有匹配的服务</strong>
          <span>换个关键词或切换筛选</span>
        </div>`;
      return;
    }

    // 选中的服务被过滤掉时，落到第一条可见项，避免右侧空着
    if (!items.some((server) => server.id === selectedId)) {
      selectedId = items[0].id;
    }

    list.innerHTML = items
      .map((server) => {
        const dot = !server.valid ? "error" : server.env && Object.keys(server.env).some((k) => /token|key|secret/i.test(k)) ? "warn" : "";
        return `
        <button class="server-row ${server.id === selectedId ? "on" : ""}" data-id="${server.id}">
          <span class="row-tile ${server.transport}">${LIST_ICON}</span>
          <span class="row-main">
            <span class="row-name">${esc(server.name)}</span>
            <span class="row-sub">${esc(endpointOf(server))}</span>
          </span>
          <span class="row-dot ${dot}"></span>
        </button>`;
      })
      .join("");

    list.querySelectorAll(".server-row").forEach((row) => {
      row.addEventListener("click", () => {
        selectedId = row.dataset.id;
        editing = false;
        revealed = new Set();
        renderList();
        renderDetail();
      });
    });
  }

  /* ============================================================
     详情
     ============================================================ */
  function renderDetail() {
    const detail = document.getElementById("detail");
    const server = SERVERS.find((item) => item.id === selectedId);
    if (!server) {
      detail.innerHTML = "";
      return;
    }

    const envEntries = Object.entries(server.env || {});
    const headerEntries = Object.entries(server.headers || {});
    const hasSecrets = [...envEntries, ...headerEntries].some(([, value]) =>
      !/^\$\{.+\}$/.test(value),
    );

    const headerBadges = [
      `<span class="pill ${server.transport === "stdio" ? "accent" : "violet"}">${TRANSPORT_LABEL[server.transport]}</span>`,
      server.valid
        ? `<span class="pill success"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="m4 12 5 5L20 6"/></svg>可用</span>`
        : `<span class="pill error"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 8v5M12 16.5v.5"/><circle cx="12" cy="12" r="9"/></svg>需处理</span>`,
      hasSecrets ? `<span class="pill warn">含明文密钥</span>` : "",
      server.employees.length > 0
        ? `<span class="pill">${server.employees.length} 位员工在用</span>`
        : `<span class="pill">尚未被引用</span>`,
    ]
      .filter(Boolean)
      .join("");

    const kvRows = [...envEntries.map(([k, v]) => ["环境变量", k, v]), ...headerEntries.map(([k, v]) => ["请求头", k, v])];
    const kvHtml = kvRows.length
      ? kvRows
          .map(([kind, key, value]) => {
            const placeholder = /^\$\{.+\}$/.test(value);
            const isSecret = !placeholder && /token|key|secret|auth/i.test(key);
            const shown = revealed.has(key) ? value : isSecret ? "••••••••••••••••" : value;
            return `
            <div class="kv-row">
              <span class="kv-key">${esc(key)}</span>
              <span class="kv-val ${isSecret && !revealed.has(key) ? "secret" : ""}">${esc(shown)}</span>
              ${placeholder ? `<span class="kv-tag">占位符</span>` : ""}
              ${isSecret ? `<button class="btn" style="height:22px;padding:0 8px;font-size:11px" data-reveal="${esc(key)}">${revealed.has(key) ? "隐藏" : "显示"}</button>` : ""}
            </div>`;
          })
          .join("")
      : `<div class="kv-row"><span class="kv-val" style="color:var(--muted)">未配置环境变量或请求头</span></div>`;

    const peopleHtml = server.employees.length
      ? server.employees
          .map(
            (person) => `
            <span class="person">
              <span class="av" style="background:${person.color}">${esc(person.name.slice(0, 1))}</span>
              ${esc(person.name)}
            </span>`,
          )
          .join("")
      : `<span class="section-hint">还没有数字员工引用这个服务</span>`;

    const definitionText = JSON.stringify(server.definition, null, 2);

    /*
     * 代码块内容单独拼好再插入：
     * 模板字符串里的换行和缩进在 white-space: pre-wrap 下会变成真实的空行，
     * 直接内联写会让代码块凭空高出一截。
     */
    const commandLine =
      server.transport === "stdio"
        ? `<span class="prompt">$ </span>${esc(endpointOf(server))}`
        : esc(endpointOf(server));
    const commandBlock = `<div class="code-block">${commandLine}<button class="copy-btn" id="copyBtn">复制</button></div>`;

    const envHint =
      kvRows.length === 0
        ? "未配置"
        : hasSecrets
          ? "存在明文密钥，注意不要提交到仓库"
          : "全部为占位符引用";

    const definitionBlock = editing
      ? `<textarea class="editor" id="definitionEditor">${esc(definitionText)}</textarea><div class="edit-actions"><button class="btn" id="cancelEdit">取消</button><button class="btn primary" id="saveEdit">保存并同步</button></div>`
      : `<div class="code-block" style="padding-right:44px">${esc(definitionText)}</div>`;

    detail.innerHTML = `
      <div class="detail-head">
        <span class="detail-tile">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
            <rect x="3" y="4" width="18" height="7" rx="2"/>
            <rect x="3" y="14" width="18" height="6" rx="2"/>
          </svg>
        </span>
        <div class="detail-title">
          <h2>${esc(server.name)}</h2>
          <div class="slug">${esc(server.slug)} · 更新于 ${esc(server.updated)}</div>
          <div class="detail-badges">${headerBadges}</div>
        </div>
        <div class="detail-head-actions">
          ${editing ? "" : `<button class="btn" id="editBtn">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 20h4l10-10-4-4L4 16z"/></svg>
            编辑定义
          </button>`}
        </div>
      </div>

      ${server.problems.length > 0
        ? `<div class="section"><div class="issue">
             <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v5M12 16.5v.5"/><circle cx="12" cy="12" r="9"/></svg>
             <span>${esc(server.problems.join("；"))}</span>
           </div></div>`
        : ""}

      <div class="section">
        <div class="section-head">
          <h3>${server.transport === "stdio" ? "启动命令" : "服务地址"}</h3>
          <span class="spacer"></span>
          <span class="section-hint">${server.transport === "stdio" ? "本机进程，随 Agent 启动" : "远程端点，按请求连接"}</span>
        </div>
        ${commandBlock}
      </div>

      <div class="section">
        <div class="section-head">
          <h3>环境变量与请求头</h3>
          <span class="spacer"></span>
          <span class="section-hint">${envHint}</span>
        </div>
        <div class="kv">${kvHtml}</div>
      </div>

      <div class="section">
        <div class="section-head"><h3>被引用的数字员工</h3></div>
        <div class="people">${peopleHtml}</div>
      </div>

      <div class="section">
        <div class="section-head">
          <h3>定义</h3>
          <span class="spacer"></span>
          <span class="section-hint">${editing ? "直接编辑 JSON，保存后写回 Claude 配置" : "只读，点击右上角「编辑定义」修改"}</span>
        </div>
        ${definitionBlock}
      </div>

      <div class="detail-foot">
        <button class="btn danger">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg>
          删除服务
        </button>
        <span class="spacer"></span>
        <button class="btn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 7l3-2.5h4L12 7h9v12H3z"/></svg>
          打开配置文件
        </button>
      </div>`;

    /* 交互 */
    const editBtn = document.getElementById("editBtn");
    if (editBtn) {
      editBtn.addEventListener("click", () => {
        editing = true;
        renderDetail();
      });
    }
    const cancelEdit = document.getElementById("cancelEdit");
    if (cancelEdit) {
      cancelEdit.addEventListener("click", () => {
        editing = false;
        renderDetail();
      });
    }
    const saveEdit = document.getElementById("saveEdit");
    if (saveEdit) {
      saveEdit.addEventListener("click", () => {
        editing = false;
        renderDetail();
      });
    }
    const copyBtn = document.getElementById("copyBtn");
    if (copyBtn) {
      copyBtn.addEventListener("click", () => {
        const text = endpointOf(server);
        navigator.clipboard?.writeText(text);
        copyBtn.textContent = "已复制";
        setTimeout(() => (copyBtn.textContent = "复制"), 1200);
      });
    }
    detail.querySelectorAll("[data-reveal]").forEach((button) => {
      button.addEventListener("click", () => {
        const key = button.dataset.reveal;
        if (revealed.has(key)) revealed.delete(key);
        else revealed.add(key);
        renderDetail();
      });
    });
  }

  /* ============================================================
     筛选 / 搜索
     ============================================================ */
  document.getElementById("filters").addEventListener("click", (event) => {
    const chip = event.target.closest(".chip");
    if (!chip) return;
    filter = chip.dataset.filter;
    document.querySelectorAll(".chip").forEach((item) => item.classList.toggle("on", item === chip));
    renderList();
    renderDetail();
  });

  document.getElementById("searchInput").addEventListener("input", (event) => {
    query = event.target.value;
    renderList();
    renderDetail();
  });

  document.getElementById("countChip").textContent = `${SERVERS.length} 个服务`;

  renderList();
  renderDetail();
</script>
</body>
</html>
